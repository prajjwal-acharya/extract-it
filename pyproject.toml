[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adapters", "agents", "api", "config", "db", "io_pipeline", "observability", "pipelines", "query", "shared"]

[project]
name = "doc-intel-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # Pydantic & settings
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Database / ORM
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
    "pgvector>=0.3.0",
    # LangGraph core + Postgres checkpointer (separate package)
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    # Observability
    "langsmith>=0.1.0",
    # LLM — Gemini direct SDK
    "google-genai>=1.0.0",
    # GCP client libs (dormant until P9)
    "google-cloud-storage>=2.17.0",
    "google-cloud-pubsub>=2.21.0",
    # Object store
    "minio>=7.2.0",
    # File-watch trigger
    "watchdog>=4.0.0",
    # Frontend
    "streamlit>=1.36.0",
    # Document parsing
    "pypdf>=4.2.0",
    # Config / schema files
    "pyyaml>=6.0.1",
    # Date parsing for universal schema canonicalization
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "vcrpy>=6.0.0",
    "respx>=0.21.0",
    "testcontainers[postgresql]>=4.7.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.0",
    "types-python-dateutil>=2.9.0",
]

[tool.mypy]
exclude = ["scripts/"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: calls real external APIs — deselect with -m 'not live'"]
