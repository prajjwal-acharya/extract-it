name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: docint
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U user -d docint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Create pgvector extension
        run: PGPASSWORD=password psql -h localhost -U user -d docint -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Round-trip migration check
        env:
          DATABASE_URL: postgresql+psycopg://user:password@localhost:5432/docint
        run: |
          alembic -c infra/migrations/alembic.ini upgrade head
          alembic -c infra/migrations/alembic.ini downgrade base
          alembic -c infra/migrations/alembic.ini upgrade head

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit -m "not live" -q

  integration-tests:
    runs-on: ubuntu-latest
    needs: [lint, migrations, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/integration -m "not live" -p no:randomly -q

  e2e-tests:
    if: false  # enable at P9
    runs-on: ubuntu-latest
    needs: [integration-tests]
    steps:
      - uses: actions/checkout@v4
      - run: echo "gated until P9"
