services:
  postgres:
    build:
      context: .
      dockerfile: infra/docker/postgres.Dockerfile
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: docint
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/init.sql:/docker-entrypoint-initdb.d/01_pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d docint"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: infra/docker/app.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://user:password@postgres:5432/docint
      MINIO_ENDPOINT: minio:9000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: infra/docker/app.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://user:password@postgres:5432/docint
      MINIO_ENDPOINT: minio:9000
      API_BASE_URL: http://app:8000
    ports:
      - "8501:8501"
    depends_on:
      - app
    volumes:
      - .:/app
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
