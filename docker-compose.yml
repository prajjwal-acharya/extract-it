services:
  app:
    build:
      context: .
      dockerfile: infra/docker/app.Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - minio
    volumes:
      - .:/app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  postgres:
    build:
      context: .
      dockerfile: infra/docker/postgres.Dockerfile
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: docint
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  frontend:
    build:
      context: .
      dockerfile: infra/docker/app.Dockerfile
    env_file: .env
    ports:
      - "8501:8501"
    depends_on:
      - app
    command: streamlit run frontend/review_app.py --server.port 8501

volumes:
  pgdata:
  miniodata:
