doc_type: bank_statement
version: "1.0"
fields:
  - name: account_holder
    type: string
    required: true
  - name: account_number
    type: string
    required: false
  - name: iban
    type: string
    required: false
  - name: bank_name
    type: string
    required: true
  - name: statement_period_start
    type: date
    format: "YYYY-MM-DD"
    required: true
  - name: statement_period_end
    type: date
    format: "YYYY-MM-DD"
    required: true
  - name: opening_balance
    type: float
    required: true
  - name: closing_balance
    type: float
    required: true
  - name: currency
    type: string
    required: true
  - name: transactions
    type: array
    required: false
    items:
      - name: date
        type: date
      - name: description
        type: string
      - name: debit
        type: float
      - name: credit
        type: float
      - name: balance
        type: float

universal_mapping:
  holder_name: account_holder
  id_number: account_number
  expiry_date: null
universal_mapping_fallback:
  id_number: iban
